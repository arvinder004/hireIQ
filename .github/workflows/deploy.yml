name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          MONGO_URI: "mongodb://localhost:27017"
          JWT_SECRET_KEY: "dummy-test-key"
        run: |
          cd backend
          PYTHONPATH=. pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Placeholder
        run: echo "Deploying to production after passing tests..."
